# Process execution detections.
# Fields: process.{pid,ppid,uid,exe,name,cmdline,cwd,stdin,stdout,remote}, parent.{exe,name,cmdline}

- id: SBS-PROC-001
  title: Download piped to shell
  description: A remote script is fetched and executed directly, a common initial-access and installer-abuse pattern.
  severity: high
  mitre: [T1059.004, T1105]
  event: process
  match:
    field: process.cmdline
    op: regex
    value: '\b(curl|wget|fetch)\b[^|;]*\|\s*(sudo\s+)?(ba|da|z|k)?sh\b'

- id: SBS-PROC-002
  title: Base64-decoded payload piped to shell
  description: Obfuscated commands are decoded and executed.
  severity: high
  mitre: [T1140, T1027, T1059.004]
  event: process
  match:
    field: process.cmdline
    op: regex
    value: 'base64\s+(-d|--decode|-D)\b[^|;]*\|\s*(ba|da|z|k)?sh\b'

- id: SBS-PROC-003
  title: Shell with network socket on stdin/stdout (reverse shell)
  description: A shell's standard input or output is a TCP/UDP socket. Unix-domain sockets (sshd, service managers) do not match.
  severity: critical
  mitre: [T1059.004, T1071]
  event: process
  match:
    all:
      - field: process.name
        value: [sh, bash, dash, zsh, ksh, ash, busybox]
      - any:
          - field: process.stdin
            value: inet
          - field: process.stdout
            value: inet

- id: SBS-PROC-004
  title: Reverse shell command line
  description: >-
    Command line contains a well-known reverse shell one-liner. The socat and
    nc directives are matched case-insensitively, so upper-case variants such as
    socat EXEC: / SYSTEM: are not missed.
  severity: high
  mitre: [T1059.004]
  event: process
  match:
    any:
      - field: process.cmdline
        op: regex
        value:
          - '/dev/(tcp|udp)/[^/\s]+/\d+'
          - 'pty\.spawn\('
      - field: process.cmdline
        op: regex
        nocase: true
        value:
          - '\bn(c|cat|etcat)\b.*\s-(e|c)\s'
          - '\bsocat\b[^|]*\b(exec|system):'

- id: SBS-PROC-005
  title: Execution from world-writable directory
  description: A binary runs from /tmp, /var/tmp or /dev/shm, where droppers usually stage payloads.
  severity: medium
  mitre: [T1204.002, T1036]
  event: process
  match:
    all:
      - field: process.exe
        op: startswith
        value: [/tmp/, /var/tmp/, /dev/shm/]
      - not:
          field: process.exe
          op: contains
          value: [/go-build, /.mount_]

- id: SBS-PROC-006
  title: Fileless or deleted-binary execution
  description: The process image is an anonymous memfd or has been deleted from disk.
  severity: high
  mitre: [T1620, T1070.004]
  event: process
  match:
    any:
      - field: process.exe
        op: startswith
        value: "/memfd:"
      - field: process.exe
        op: endswith
        value: " (deleted)"

- id: SBS-PROC-007
  title: Credential store access
  description: A command line references the shadow password files.
  severity: high
  mitre: [T1003.008]
  event: process
  match:
    all:
      - field: process.cmdline
        op: regex
        value: '/etc/g?shadow\b'
      - not:
          field: process.name
          value: [passwd, chpasswd, useradd, usermod, userdel, groupadd, unix_chkpwd, chage, pwck, grpck]

- id: SBS-PROC-008
  title: Shell history tampering
  description: Shell history is cleared or disabled to hide activity.
  severity: medium
  mitre: [T1070.003]
  event: process
  match:
    field: process.cmdline
    op: regex
    value: 'history\s+-c\b|unset\s+HISTFILE|HISTFILE=/dev/null|HISTSIZE=0|(rm|shred|truncate)\b.*\.(bash|zsh)_history'

- id: SBS-PROC-009
  title: SUID/SGID bit set with chmod
  description: chmod adds the setuid or setgid bit, often for privilege-escalation backdoors.
  severity: medium
  mitre: [T1548.001]
  event: process
  match:
    all:
      - field: process.name
        value: chmod
      - field: process.cmdline
        op: regex
        value: '(\s[ugoa]*\+[rwx]*s|\s0?[2-7][0-7]{3}\s)'

- id: SBS-PROC-010
  title: Cryptocurrency miner command line
  description: Mining pool URL or well-known miner arguments.
  severity: high
  mitre: [T1496]
  event: process
  match:
    field: process.cmdline
    op: regex
    nocase: true
    value: 'stratum\+(tcp|ssl)://|--donate-level|\bxmrig\b|\bminerd\b|\bcpuminer\b'

- id: SBS-PROC-011
  title: Kernel module loaded with insmod
  description: A kernel module is inserted directly; rootkits are commonly loaded this way.
  severity: medium
  mitre: [T1547.006]
  event: process
  match:
    field: process.name
    value: insmod

- id: SBS-PROC-012
  title: Web server spawned a shell
  description: A web server or application runtime started a shell, a sign of a webshell or RCE.
  severity: high
  mitre: [T1505.003, T1190]
  event: process
  match:
    all:
      - field: parent.name
        value: [nginx, apache2, httpd, php-fpm, php-fpm8, lighttpd, tomcat, caddy]
      - field: process.name
        value: [sh, bash, dash, zsh, ksh]

- id: SBS-PROC-013
  title: System log tampering
  description: Logs under /var/log are deleted or truncated.
  severity: medium
  mitre: [T1070.002]
  event: process
  match:
    field: process.cmdline
    op: regex
    value: '(truncate\s+-s\s*0\s+|\brm\s+(-\w+\s+)*|>\s*)/var/log/'

- id: SBS-PROC-014
  title: Interpreter spawning a socket-backed shell (reverse shell)
  description: >-
    A scripting interpreter (python, perl, ruby, php, node, lua, ...) opens a
    network socket and hands it to a shell, the interpreter form of a reverse
    shell that rules keyed on shell names alone (SBS-PROC-003) miss because the
    socket is created inside the interpreter. Fires only when the command line
    shows BOTH a socket primitive AND a shell being launched, so ordinary
    interpreter use (an app, a one-liner that only prints) does not match.
  severity: critical
  mitre: [T1059.004, T1059.006, T1071]
  event: process
  match:
    all:
      - field: process.name
        value: [python, python2, python3, perl, perl5, ruby, php, php7, php8, node, nodejs, lua, lua5.1, lua5.3, lua5.4]
      - field: process.cmdline
        op: regex
        value:
          - 'socket\.socket\s*\('
          - '\bSOCK_STREAM\b'
          - '\bp?fsockopen\s*\('
          - '\bTCPSocket\b'
          - 'require\s*\(?\s*["'']socket["'']'
          - '\bSocket\.new\b'
          - '\bsocket\s*\(\s*(S|AF_INET|PF_INET|Socket)'
          - 'net\.(connect|createConnection|Socket)\b'
          - '/dev/tcp/'
      - field: process.cmdline
        op: regex
        value:
          - '/bin/(ba|da|z|k)?sh\b'
          - '/bin/busybox\b'
          - '\bos\.system\s*\('
          - '\bsubprocess\.(Popen|call|run)\b'
          - '\bpty\.spawn\s*\('
          - '\bIO\.popen\b'
          - '\bchild_process\b'
          - '\b(exec|system|spawn)\s*\(\s*["''][^"'']*\b(ba|da|z|k)?sh\b'

- id: SBS-PROC-015
  title: Script interpreter running a script from a world-writable or home directory
  description: >-
    A shell or interpreter executes a script staged under /tmp, /var/tmp,
    /dev/shm, /run/user or a hidden path in a home directory. SBS-PROC-005 keys
    on process.exe, which for a shebang script is the interpreter (/bin/sh), so
    a dropped *script* slips past it; this rule inspects the script path on the
    command line instead. Build-tool and package-manager scratch paths are
    excluded to keep false positives at zero.
  severity: medium
  mitre: [T1204.002, T1059]
  event: process
  match:
    all:
      # The process is an interpreter. A shebang script's comm is the script's
      # own basename (e.g. ".update.sh"), not "sh", so match on the resolved
      # exe as well as the comm.
      - any:
          - field: process.name
            value: [sh, bash, dash, zsh, ksh, ash, busybox, python, python2, python3, perl, perl5, ruby, php, php7, php8, node, nodejs, lua, lua5.1, lua5.3, lua5.4]
          - field: process.exe
            op: regex
            value: '/(sh|bash|dash|zsh|ksh|ash|busybox|python[0-9.]*|perl[0-9.]*|ruby|php[0-9]*|node|nodejs|lua[0-9.]*)$'
      - field: process.cmdline
        op: regex
        value:
          - '^(\S*/)?(sh|bash|dash|zsh|ksh|ash|busybox|python[0-9.]*|perl[0-9.]*|ruby|php[0-9]*|node|nodejs|lua[0-9.]*)\s+(--?\S+\s+)*(/tmp/|/var/tmp/|/dev/shm/|/run/user/[0-9]+/)\S+\.(sh|bash|dash|zsh|ksh|py|pyc|pl|rb|php|lua|js)\b'
          - '^(\S*/)?(sh|bash|dash|zsh|ksh|ash|busybox|python[0-9.]*|perl[0-9.]*|ruby|php[0-9]*|node|nodejs|lua[0-9.]*)\s+(--?\S+\s+)*/home/[^/\s]+/(\S+/)?\.[^/\s]*\.(sh|bash|py|pyc|pl|rb|php|lua|js)\b'
      - not:
          field: process.cmdline
          op: contains
          value: [/go-build, /pip-build-, /pip-ephem-, /tmp/tmp., /ccache, /node_modules/.bin/]

- id: SBS-PROC-016
  title: Scheduled task or transient unit persistence
  description: >-
    A new crontab is installed from stdin or a file, a systemd transient unit /
    scope / timer is created, or an at/batch job is scheduled. These establish
    persistence or execution outside the watched filesystem paths. Listing or
    editing an existing crontab (crontab -l / -e) and the at/atq query commands
    are not flagged.
  severity: medium
  mitre: [T1053.002, T1053.003, T1053.006]
  event: process
  match:
    any:
      - all:
          - field: process.name
            value: crontab
          - field: process.cmdline
            op: regex
            value:
              - '\bcrontab\b(\s+-u\s+\S+)?\s+-\s*$'
              - '\bcrontab\b(\s+-u\s+\S+)?\s+[^\s-]\S*\s*$'
      - field: process.name
        value: systemd-run
      - all:
          - field: process.name
            value: [at, batch]
          - not:
              field: process.cmdline
              op: regex
              value: '\b(atq|at\s+-l\b|at\s+-c\b)'

- id: SBS-PROC-017
  title: Service enabled for persistence via systemctl
  description: >-
    systemctl enables, links or wires a unit so it starts automatically, a
    service-persistence technique. Read-only and transient actions (status,
    start, restart, daemon-reload) are not flagged.
  severity: low
  mitre: [T1543.002]
  event: process
  match:
    all:
      - field: process.name
        value: [systemctl]
      - field: process.cmdline
        op: regex
        value: '\bsystemctl\b[^|]*\s(enable|link|add-wants|add-requires|set-default)\b'

- id: SBS-PROC-018
  title: Shell startup or user-service file modified for persistence
  description: >-
    A command line appends to a shell startup file (~/.bashrc, ~/.profile, ...)
    or writes into a per-user systemd / autostart location, both ways to run
    attacker code on the next login or session without touching a watched
    system path. Matches only write/redirect operations, so reading an rc file
    is not flagged.
  severity: medium
  mitre: [T1546.004, T1543.002]
  event: process
  match:
    field: process.cmdline
    op: regex
    value:
      - '>>?\s*(~|\$HOME|/root|/home/[^/\s]+)/\.(bashrc|bash_profile|bash_login|profile|zshrc|zprofile|zlogin|kshrc|cshrc|tcshrc|login)\b'
      - '>>?\s*(~|\$HOME|/root|/home/[^/\s]+)/\.config/(autostart|systemd/user)/'
      - '\b(tee|install|cp|mv|cat)\b[^|]*\s(/etc/profile\.d/|(~|\$HOME|/root|/home/[^/\s]+)/\.config/systemd/user/)\S'

- id: SBS-PROC-019
  title: LD_PRELOAD hijack via command line
  description: >-
    LD_PRELOAD is set to a library under a writable or home directory, or a
    library path is written into an ld.so.preload file. Both force attacker code
    into other processes (userland rootkit). Preloading a system library under
    /usr or /lib is not flagged, so legitimate preloads stay quiet.
  severity: high
  mitre: [T1574.006]
  event: process
  match:
    any:
      - field: process.cmdline
        op: regex
        value: 'LD_PRELOAD=\S*(/tmp/|/var/tmp/|/dev/shm/|/run/user/|/home/|~/|\./)\S*\.so'
      - field: process.cmdline
        op: regex
        value: '>>?\s*\S*ld\.so\.preload'
